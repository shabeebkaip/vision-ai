name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *"  # nightly full video regression (04:00 Riyadh)

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy shared/src edge/src ml/src
      - name: Licence guard
        run: uv run python scripts/licence_check.py
      - name: No rfdetr-plus in the lockfile
        run: "! grep -q 'name = \"rfdetr-plus\"' uv.lock"
      - name: Tests
        run: uv run pytest --cov=vision_shared --cov=vision_edge --cov=vision_ml --cov-report=term-missing
      - name: Video regression (synthetic + cached detections)
        run: uv run vision-eval run --strict --out var/eval
      - name: Scorecard
        if: always()
        run: cat var/eval/scorecard.md >> "$GITHUB_STEP_SUMMARY" || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dev compose file is valid
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env config -q
      - name: Edge image builds (slim, without PyTorch)
        run: docker build -f deploy/edge/Dockerfile --build-arg EDGE_EXTRAS= -t vision-edge:ci .
      - name: Edge image runs
        run: docker run --rm -v "$PWD/deploy/dev:/config:ro" vision-edge:ci validate /config/site.yaml
