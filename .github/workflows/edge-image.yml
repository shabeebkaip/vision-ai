name: Edge image

on:
  pull_request:
    paths: ["edge/**", "shared/**", "deploy/edge/**", "uv.lock", "pyproject.toml"]
  push:
    branches: [main]
    paths: ["edge/**", "shared/**", "deploy/edge/**", "uv.lock", "pyproject.toml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker build -f deploy/edge/Dockerfile -t codeox/vision-edge:ci .
      - name: Smoke test
        run: |
          docker run --rm codeox/vision-edge:ci --help
          docker run --rm -v "$PWD/examples:/examples:ro" codeox/vision-edge:ci validate /examples/office-hikvision/site.yaml
