# Alembic config for the cloud database (CLD-01).
#   uv run alembic -c cloud/alembic.ini upgrade head
# or simply:  uv run vision-cloud migrate
# The URL comes from VISION_CLOUD_DATABASE_URL (or `-x url=...`).
[alembic]
script_location = vision_cloud:migrations
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
