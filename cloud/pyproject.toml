[project]
name = "vision-cloud"
version = "0.1.0"
description = "Code-Ox Vision cloud backend: device API, event ingest, tenants, auth, dashboard API"
requires-python = ">=3.10"
dependencies = [
    "vision-shared",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "boto3>=1.34",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=42",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.scripts]
vision-cloud = "vision_cloud.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_cloud"]
