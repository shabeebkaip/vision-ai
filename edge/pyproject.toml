[project]
name = "vision-edge"
version = "0.1.0"
description = "Code-Ox Vision edge pipeline: camera -> detector -> tracker -> rules -> events"
requires-python = ">=3.10"
dependencies = [
    "vision-shared",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "scipy>=1.11",
    "onnxruntime>=1.19",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
# RF-DETR (Apache-2.0 for Nano/Small/Medium/Large) for development and model export.
# Pulls PyTorch; production edge boxes run the exported ONNX/TensorRT model instead.
rfdetr = ["rfdetr>=1.3"]

[project.scripts]
vision-edge = "vision_edge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_edge"]
