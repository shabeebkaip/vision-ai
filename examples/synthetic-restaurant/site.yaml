# Example site: one restaurant counter camera, replaying the synthetic queue scenario.
# Generate the inputs first:  uv run vision-eval synth --out test-videos/synthetic --video
# Then run:  uv run vision-edge run examples/synthetic-restaurant/site.yaml --camera counter \
#              --video test-videos/synthetic/syn-queue-001.mp4 --outbox var/outbox-demo
id: demo-restaurant
name: Demo restaurant (synthetic)
timezone: Asia/Riyadh
cameras:
  - id: counter
    name: Counter camera
    source: ../../test-videos/synthetic/syn-queue-001.detections.jsonl
    fps: 5
    zones:
      - id: counter_queue
        name: Counter queue
        polygon: [[0.30, 0.55], [0.70, 0.55], [0.70, 0.95], [0.30, 0.95]]
rules:
  - id: queue
    name: Queue too long
    type: queue_length_over
    camera_id: counter
    zone_id: counter_queue
    threshold: 4
    min_duration_s: 20
    cooldown_s: 600
    severity: warning
  - id: counter_unattended
    name: Counter unattended
    type: zone_empty
    camera_id: counter
    zone_id: counter_queue
    min_duration_s: 600
    schedule: {days: [1, 2, 3, 4, 5, 6, 7], start: "08:00", end: "23:30"}
