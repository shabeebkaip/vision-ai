[project]
name = "vision-ml"
version = "0.1.0"
description = "Code-Ox Vision evaluation harness, datasets and training tools"
requires-python = ">=3.10"
dependencies = [
    "vision-shared",
    "vision-edge",
]

[project.scripts]
vision-eval = "vision_ml.eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_ml"]
