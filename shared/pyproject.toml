[project]
name = "vision-shared"
version = "0.1.0"
description = "Shared schemas (camera, zone, rule, event, test-clip manifest) for Code-Ox Vision"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_shared"]
